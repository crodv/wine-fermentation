  const el = node('button', text, cls);
  el.type = 'button';
  el.addEventListener('click', action);
  return el;
}

function link(text, href, cls) {
  const el = node('a', text, cls);
  el.href = href;
  return el;
}

function showItem(id) {
  if (!byId.has(id)) return;
  selected = id;
  location.hash = id;
  render();
  const heading = byEl('detail').querySelector('h3');
  heading.tabIndex = -1;
  heading.focus({preventScroll:true});
  if (matchMedia('(max-width:690px)').matches) heading.scrollIntoView({block:'nearest'});
}

function normalize(s) {
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replaceAll('₂','2');
}

for (const category of ['Química','CO₂']) {
  const group = node('optgroup');
  group.label = category;
  for (const item of calibrations.filter(cal => cal.category === category)) {
    group.append(new Option(item.name, item.name));
  }
  calibration.append(group);
}
for (const type of [...new Set(notebooks.map(item => item.kind))].sort()) kind.append(new Option(type,type));

const steps = new Map();
for (const [container, items] of Object.entries(roadmap)) {
  const mount = byEl(container);
  for (const [i, [id, label]] of items.entries()) {
    if (i) {
      const arrow = node('span','→','bullet');
      arrow.setAttribute('aria-hidden','true');
      mount.append(arrow);
    }
    const el = button(label,'step', () => showItem(id));
    el.setAttribute('aria-label', label + ', ' + byId.get(id).title);
    steps.set(el,id);
    mount.append(el);
  }
}
const areaButtons = new Map();
for (const name of ['', ...areaOrder]) {
  const el = button(name || 'Todos','', () => { area = name; renderList(); });
  areaButtons.set(name,el);
  byEl('areas').append(el);
}

function renderList() {
  for (const [name, el] of areaButtons) el.setAttribute('aria-pressed', String(name === area));
  const words = normalize(search.value).trim().split(/\s+/).filter(Boolean);
  const visible = notebooks.filter(item => {
    const tags = [...item.chem, ...item.gas];
    const haystack = normalize([item.title,item.area,item.code,item.source,item.summary,...tags].join(' '));
    return (!area || area === item.area) && (!kind.value || kind.value === item.kind)
      && (!calibration.value || tags.includes(calibration.value)) && words.every(word => haystack.includes(word));
  });
  byEl('count').textContent = visible.length + ' de ' + notebooks.length + ' notebooks';
  const entries = byEl('entries');
  entries.replaceChildren();
  if (visible.length === 0) entries.append(node('p','No hay resultados para esos filtros.','empty'));
  for (const item of visible) {
    const row = button(undefined,'entry', () => showItem(item.id));
    row.dataset.notebook = item.id;
    row.setAttribute('aria-current', String(selected === item.id));
    const description = node('span');
    description.append(node('strong',item.title),node('small',item.code + ' · ' + item.kind));
    row.append(description, node('span',item.chem.join(' · ') || '—','chem'), node('span',item.gas.join(' · ') || '—','gas'));
    entries.append(row);
  }
}

function detailSection(title) {
  const section = node('section');
  section.append(node('h4',title));
  return section;
}

function related(parent, title, items) {
  if (!items.length) return;
  const section = detailSection(title);
  const list = node('div',undefined,'tags');
  for (const item of items) list.append(button(item.code,'tag',() => showItem(item.id)));
  section.append(list);
  parent.append(section);
}

function renderDetail() {
  const item = byId.get(selected);
  const detail = byEl('detail');
  const actions = node('div',undefined,'links');
  if (item.executed === item.source) {
    actions.append(link('Abrir notebook', '../' + item.source,'minor-link primary'));
  } else {
    if (item.executed) actions.append(link('Abrir resultados', '../' + item.executed,'minor-link primary'));
    actions.append(link('Abrir fuente','../' + item.source,'minor-link'));
  }
  detail.replaceChildren(node('p',item.code + ' · ' + item.kind,'meta'), node('h3',item.title),
                         node('p',item.summary),node('p',item.source,'path'),actions);
  for (const [title,names] of [['Química',item.chem],['Capa de CO₂',item.gas]]) {
    if (!names.length) continue;
    const section = detailSection(title);
    const list = node('ul');
    for (const name of names) {
      const cal = byCal.get(name);
      const line = node('li');
      line.append(node('strong',name + '. '),document.createTextNode(cal.description + ' '));
      if (cal.path) line.append(link('Parámetros','../' + cal.path));
      if (cal.origin && cal.origin !== item.id) {
        line.append(button('Origen', 'tag', () => showItem(cal.origin)));
      }
      line.append(button('Filtrar', 'tag', () => { calibration.value = name; area = ''; search.value = ''; kind.value = ''; renderList(); }));
      list.append(line);
    }
    section.append(list);
    detail.append(section);
  }
  related(detail,'Antecedentes',item.parents.map(id => byId.get(id)));
  related(detail,'Continúa en',notebooks.filter(other => other.parents.includes(item.id)));
  if (item.id === 'e22') detail.append(node('p','Recalibrar la cola de S sigue pendiente.','note'));
}

function render() {
  for (const [el,id] of steps) el.setAttribute('aria-current',String(id === selected));
  renderList();
  renderDetail();
}

for (const el of [search, calibration, kind]) {
  el.addEventListener(el === search ? 'input' : 'change', renderList);
}
byEl('reset').addEventListener('click', () => {
  search.value = ''; calibration.value = ''; kind.value = ''; area = ''; renderList(); search.focus();
});
window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1);
  if (byId.has(id) && selected !== id) { selected = id; render(); }
});
render();
</script>
</body>
</html>
